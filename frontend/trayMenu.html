<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>托盘菜单</title>
<!-- 兜底浅色样式在前，皮肤变量注入位（style#skinVars）置后：同级 :root 后出现者胜，
     确保主进程注入的皮肤变量能覆盖兜底值 -->

<style id="skinVars"></style>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/pages/trayMenu.css">
</head>
<body>
<div class="tray-menu" id="trayMenu">
  <div class="tray-menu__head" id="trayHead" style="display:none">预览版 · 数据与正式版隔离</div>
  <button data-action="show_main">显示主窗口</button>
  <span class="sep"></span>
  <button data-action="open_tasks">打开任务列表</button>
  <span class="sep"></span>
  <button data-action="open_tools">视频处理工具</button>
  <span class="sep"></span>
  <button data-action="open_settings">设置</button>
  <span class="sep"></span>
  <button data-action="open_browser">在浏览器中打开</button>
  <span class="sep" id="sepUpdate"></span>
  <button data-action="check_update" id="btnUpdate">检查更新</button>
  <span class="sep"></span>
  <button data-action="quit">退出</button>
</div>
<script>
  (function () {
    // 预览版标识行（仅在 vlBuild.preview 时显示）
    try {
      if (window.vlBuild && window.vlBuild.preview) {
        var head = document.getElementById('trayHead');
        if (head) head.style.display = '';
      }
    } catch (e) {}
    var api = window.txapi;
    if (!api) return;
    document.getElementById('trayMenu').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (btn && api.tray_menu_click) api.tray_menu_click(btn.getAttribute('data-action')).catch(function () {});
    });
  })();
</script>
</body>
</html>
