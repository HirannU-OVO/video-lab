<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卸载 Video Lab</title>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages/uninstall.css">
</head>
<body>
  <div class="titlebar">
    <span class="t">卸载 Video Lab</span><span class="sp"></span>
    <button id="btnClose" title="关闭">✕</button>
  </div>
  <div class="body">
    <h1>卸载 Video Lab</h1>
    <label class="check" id="wrapCheck">
      <input type="checkbox" id="chkDelete">
      <span>
        <b>同时删除个人数据</b>
        <span class="hint block">包含设置、缓存、任务记录与运行日志，删除后不可恢复。</span>
      </span>
    </label>
  </div>
  <div class="foot">
    <p class="err" id="errMsg"></p>
    <button class="btn" id="btnCancel">取消</button>
    <button class="btn primary" id="btnGo">继续卸载</button>
  </div>
  <div class="modal" id="modal">
    <div class="box">
      <h2>确认删除个人数据？</h2>
      <p>设置、缓存、任务记录与运行日志将被删除，删除后不可恢复。</p>
      <div class="acts">
        <button class="btn" id="btnBack">取消</button>
        <button class="btn danger" id="btnConfirm">删除并卸载</button>
      </div>
    </div>
  </div>
  <script src="uninstall.js"></script>
</body>
</html>
