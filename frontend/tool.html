<!DOCTYPE html>
<html lang="zh-CN" data-skin="white_blue"><head>
  <meta charset="UTF-8">
  <title>Video Lab - 视频处理</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="skins/white_blue.css">
  <link rel="stylesheet" href="skins/Black_Orange.css">
  <link rel="stylesheet" href="skins/Maid_Atelier.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="../icon/preview/app-icon.png">
  <script>
    if (location.protocol.startsWith('http')) {
var m = new URL(location.href).searchParams.get('token');
      if (m) localStorage.setItem('tx_token', m);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
      var sk = new URL(location.href).searchParams.get('skin');
      if (sk) document.documentElement.setAttribute('data-skin', sk); else { try { var _sk0 = localStorage.getItem('vl_skin'); if (_sk0) document.documentElement.setAttribute('data-skin', _sk0); } catch (e) {} }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; padding-top: 34px;
           background: var(--bg-base-default); color: var(--text-default); font-family: var(--font-family-default); }

    /* ── 输入区（两 Tab 之外：目录与递归）── */
    .tl-input { flex-shrink: 0; padding: 10px 14px; border-bottom: 1px solid var(--border-neutral-l1); background: var(--bg-base-default); }
    .tl-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tl-label { flex-shrink: 0; font-size: var(--body-sm-font-size); color: var(--text-secondary); }
    .tl-text {
      flex: 1; min-width: 180px; height: 28px; padding: 0 8px; border-radius: var(--radius-6);
      border: 1px solid var(--border-neutral-l2); background: var(--bg-input-default); color: var(--text-default);
      font-family: var(--font-family-default); font-size: var(--body-sm-font-size);
    }
    .tl-text::placeholder { color: var(--text-tertiary); }
    .tl-btn {
      display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px;
      white-space: nowrap; flex-shrink: 0;   /* 文字恒一行、且不参与压缩（压缩交给同行输入框） */
      border-radius: var(--radius-6); border: 1px solid var(--border-neutral-l2);
      background: transparent; color: var(--text-secondary); cursor: pointer;
      font-family: var(--font-family-default); font-size: var(--body-sm-font-size);
      transition: background .15s ease, color .15s ease;
    }
    .tl-btn:hover { background: var(--bg-overlay-l1); color: var(--text-default-hover); }
    .tl-btn:disabled { opacity: .5; cursor: not-allowed; }
    .tl-check { display: inline-flex; align-items: center; gap: 5px; font-size: var(--body-sm-font-size); color: var(--text-secondary); cursor: pointer; }
    .tl-hint { margin-top: 6px; font-size: var(--body-xs-font-size); color: var(--text-tertiary); line-height: 1.5; }
    .tl-hint--warn { color: var(--status-warning-default); }

    /* ── Tab ── */
    .tl-tabs { flex-shrink: 0; display: flex; gap: 8px; padding: 8px 14px 0; border-bottom: 1px solid var(--border-neutral-l1); background: var(--bg-base-default); }
    .tl-tab {
      display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
      border: 1px solid transparent; border-bottom: none; border-radius: var(--radius-6) var(--radius-6) 0 0;
      background: transparent; color: var(--text-secondary); cursor: pointer;
      font-family: var(--font-family-default); font-size: var(--body-sm-font-size);
    }
    .tl-tab:hover { background: var(--bg-overlay-l1); color: var(--text-default-hover); }
    .tl-tab--active { background: var(--bg-base-tertiary); border-color: var(--border-neutral-l1); color: var(--text-default); font-weight: var(--font-weight-strong); }

    /* ── 滚动区 ── */
    .tl-scroll { flex: 1; overflow-y: auto; padding: 10px 14px 14px; }
    .tl-pane[hidden] { display: none; }
    .tl-note { margin-bottom: 8px; padding: 8px 10px; border-radius: var(--radius-6);
               background: var(--status-error-surface-l1); color: var(--status-error-default); font-size: var(--body-sm-font-size); line-height: 1.5; }

    /* ── 步骤分组（框体）：默认全部展开 ── */
    .tl-group { margin-bottom: 6px; border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); overflow: hidden; }
    .tl-group__head {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer; user-select: none;
      background: var(--bg-overlay-l1); font-size: var(--body-sm-font-size); font-weight: var(--font-weight-strong); color: var(--text-default);
    }
    .tl-group__head:hover { background: var(--bg-overlay-l2); }
    .tl-group__arrow { display: inline-flex; transition: transform .15s ease; color: var(--text-tertiary); }
    .tl-group--open .tl-group__arrow { transform: rotate(90deg); }
    .tl-group__count { margin-left: auto; font-size: var(--body-xs-font-size); font-weight: var(--font-weight-default); color: var(--text-tertiary); }
    .tl-group__body { display: none; padding: 0; }
    .tl-group--open .tl-group__body { display: block; }

    /* ── 单步（折叠项）：默认**不勾选且折叠**，勾选后自动展开 ── */
    .tl-step { border-top: 1px solid var(--border-neutral-l1); }
    .tl-step:first-child { border-top: none; }
    .tl-step__head { display: flex; align-items: center; gap: 6px; padding: 5px 10px; cursor: pointer; user-select: none; }
    .tl-step__head:hover { background: var(--bg-overlay-l1); }
    .tl-step__arrow { display: inline-flex; color: var(--text-tertiary); transition: transform .15s ease; -webkit-app-region: no-drag; }
    .tl-step--open .tl-step__arrow { transform: rotate(90deg); }
    .tl-step__title { font-size: var(--body-sm-font-size); color: var(--text-default); white-space: nowrap; }
    .tl-step__flag { flex-shrink: 0; padding: 0 6px; height: 15px; line-height: 15px; border-radius: 8px;
                    font-size: 10px; background: color-mix(in srgb, var(--status-warning-default) 18%, transparent); color: var(--status-warning-default); }
    /* 参数区：一行一个参数（标签 + 输入 + 说明并排），尽量压缩纵向高度 */
    .tl-params { display: none; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 2px 10px 8px 30px; }
    .tl-step--open .tl-params { display: flex; }
    .tl-step:not(.tl-step--on) .tl-params { opacity: .5; pointer-events: none; }
    .tl-field { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .tl-field__label { font-size: var(--body-xs-font-size); color: var(--text-secondary); white-space: nowrap; }
    .tl-field__hint { font-size: 10px; color: var(--text-tertiary); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-field__row { display: flex; align-items: center; gap: 6px; }
    .tl-num, .tl-sel, .tl-path {
      height: 25px; padding: 0 6px; border-radius: var(--radius-6);
      border: 1px solid var(--border-neutral-l2); background: var(--bg-input-default); color: var(--text-default);
      font-family: var(--font-family-default); font-size: var(--body-sm-font-size);
    }
    .tl-num { width: 84px; }
    .tl-sel { min-width: 104px; }
    .tl-path { min-width: 180px; max-width: 320px; }
    /* 转分辨率的锁链按钮：锁定=主题色竖链，解绑=灰链 */
    .tl-link {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 26px; height: 25px; border-radius: var(--radius-6);
      border: 1px solid var(--border-neutral-l2); background: transparent; color: var(--text-tertiary);
      cursor: pointer; transition: color .15s ease, border-color .15s ease;
    }
    .tl-link:hover { background: var(--bg-overlay-l1); }
    .tl-link svg { transition: transform .15s ease; }
    .tl-link--on { color: var(--brand-500); border-color: var(--brand-500); }
    .tl-link--on svg { transform: rotate(-45deg); }
    .tl-mini {
      display: inline-flex; align-items: center; gap: 4px;
      height: 25px; padding: 0 8px; border-radius: var(--radius-6); border: 1px solid var(--border-neutral-l2);
      background: transparent; color: var(--text-secondary); cursor: pointer; font-size: var(--body-xs-font-size);
      font-family: var(--font-family-default);
    }
    .tl-mini:hover { background: var(--bg-overlay-l1); color: var(--text-default-hover); }
    .tl-ro { padding: 4px 0; font-size: var(--body-sm-font-size); color: var(--text-tertiary); line-height: 1.6; }

    /* ── 输出设置 ── */
    .tl-out { margin-top: 12px; border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); }
    .tl-out__head { padding: 8px 10px; background: var(--bg-overlay-l1); border-bottom: 1px solid var(--border-neutral-l1);
                    font-size: var(--body-sm-font-size); font-weight: var(--font-weight-strong); }
    .tl-out__body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .tl-out__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tl-out__row--hide { display: none; }
    .tl-sep { height: 1px; background: var(--border-neutral-l1); }

    /* 状态 + 开始按钮：作为输出设置框的最后一行（不单独占一条底部栏，省一栏纵向空间） */
    .tl-out__row--run { flex-wrap: nowrap; }
    .tl-status { flex: 1; min-width: 0; font-size: var(--body-sm-font-size); color: var(--text-secondary);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-status--err { color: var(--status-error-default); }
    .tl-status--ok { color: var(--status-success-default); }
    .tl-run {
      display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 18px;
      border: none; border-radius: var(--radius-6); background: var(--brand-500); color: var(--text-onaccent);
      cursor: pointer; font-family: var(--font-family-default); font-size: var(--body-sm-font-size); font-weight: var(--font-weight-strong);
      transition: background .15s ease;
    }
    .tl-run:hover { background: var(--brand-600); }
    .tl-run:disabled { background: var(--bg-brand-disabled); cursor: not-allowed; }

    /* ── 运行日志（折叠区，便于当场看逐文件结果）── */
    .tl-log { margin-top: 10px; border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); overflow: hidden; }
    .tl-log[hidden] { display: none; }
    .tl-log__head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; user-select: none;
                    background: var(--bg-overlay-l1); font-size: var(--body-sm-font-size); }
    .tl-log__body { display: none; max-height: 190px; overflow-y: auto; padding: 8px 10px;
                    font-family: var(--font-family-mono); font-size: 11px; line-height: 1.6; color: var(--text-secondary); white-space: pre-wrap; word-break: break-all; }
    .tl-log--open .tl-log__body { display: block; }
    .tl-log--open .tl-group__arrow { transform: rotate(90deg); }
    .tl-prog { height: 4px; background: var(--bg-overlay-l2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .tl-prog__bar { height: 100%; width: 0; background: var(--brand-500); transition: width .2s ease; }

    /* ── 画布合成（竖转横）：预览舞台 + 参数区 ── */
    /* 左参数、右预览：用 order 调换视觉顺序（窄屏堆叠时参数自然排在预览上方） */
    .cv-wrap { display: flex; gap: 12px; align-items: flex-start; }
    .cv-side { order: 2; flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .cv-bars { display: flex; flex-direction: column; gap: 6px; }
    /* 对话框文本输入（自绘，替代 Electron 不支持的 window.prompt） */
    .modal__field { margin: 2px 0 12px; }
    .modal__input { width: 100%; height: 32px; padding: 0 10px; box-sizing: border-box;
      border-radius: var(--radius-6); border: 1px solid var(--border-neutral-l2);
      background: var(--bg-input-default); color: var(--text-default); font-size: 13px; }
    .modal__input:focus { outline: none; border-color: var(--brand-500); }
    /* 舞台：**不加任何装饰**（无背景 / 无边框 / 无圆角 / 无内边距）——
       预览就是画面本身，画布被限高变窄时露出的应是页面底色，而不是一块多余的深色底板。
       仅保留 flex 居中（竖向输出变窄后居中，不贴左）。 */
    .cv-stage { position: relative;
                display: flex; align-items: center; justify-content: center; }
    /* 画布尺寸由 JS 按「可用宽 + 高度上限（视口 58%）」contain 计算后**显式给出**（见 cvSyncStageAspect）：
       纯 CSS 的 aspect-ratio + max-height 在高度被限时**不会**回头收窄宽度，会把画面压变形 —— 故用 JS 算更可靠。
       这里的 width / aspect-ratio 仅作 JS 就位前的兜底。 */
    /* 画布：直角 + 深色画面区（代表输出画面本身），不再做圆角 —— 与"实时预览"语义一致 */
    .cv-canvas { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0d0f12;
                 overflow: hidden; touch-action: none; user-select: none; }
    /* object-fit: contain 是兜底 —— 万一画布比例与帧比例短暂不一致（改尺寸到新帧返回之间），
       旧帧也只是等比缩放居中，绝不会被拉变形 */
    .cv-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; }
    /* 拖动时合成帧半透明：保留画面参考，又不挡住内容盒与吸附线 */
    .cv-canvas--drag .cv-layer--comp { opacity: .35; }
    /* 占位示意层：未开启「实时预览」时覆盖显示 —— 真实帧做底 + 内容块虚线，几何随参数即时更新 */
    .cv-hold { position: absolute; inset: 0; display: none; pointer-events: none; }
    .cv-canvas--hold .cv-hold { display: block; }
    .cv-hold__box { position: absolute; background: rgba(22, 104, 220, 0.16); border: 1px dashed var(--brand-500); }
    .cv-hold__tag { position: absolute; left: 8px; bottom: 8px; padding: 2px 6px; border-radius: 4px;
      font-size: 11px; background: rgba(0, 0, 0, 0.55); color: #fff; }
    /* 内容框：预览就绪即可拖动（--ready）；拖动中与就绪态都显示手柄 */
    .cv-box { position: absolute; border: 1px solid var(--brand-500); cursor: move; display: none; }
    .cv-canvas--ready .cv-box { display: block; }
    .cv-canvas--drag .cv-box { display: block; }
    .cv-hd { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: var(--brand-500);
             border: 1px solid #fff; border-radius: 2px; }
    /* 只保留四个角手柄（等比缩放）；边的非等比手柄已随「内容拉伸」一并取消 */
    .cv-hd[data-hd="tl"] { left: 0; top: 0; cursor: nwse-resize; }
    .cv-hd[data-hd="tr"] { left: 100%; top: 0; cursor: nesw-resize; }
    .cv-hd[data-hd="br"] { left: 100%; top: 100%; cursor: nwse-resize; }
    .cv-hd[data-hd="bl"] { left: 0; top: 100%; cursor: nesw-resize; }
    .cv-hd--off { opacity: .35; cursor: not-allowed; }
    .cv-guide { position: absolute; background: #ffd166; display: none; pointer-events: none; }
    .cv-guide--v { top: 0; bottom: 0; width: 1px; }
    .cv-guide--h { left: 0; right: 0; height: 1px; }
    .cv-badge { position: absolute; right: 14px; top: 14px; padding: 2px 8px; border-radius: 10px;
                font-size: 11px; background: rgba(0,0,0,.55); color: #eaeef5; }
    .cv-badge--drag { background: #7a5c00; }
    .cv-badge--ok { background: #14532d; }
    .cv-badge--err { background: #7f1d1d; }
    .cv-warn { font-size: 11px; line-height: 1.6; color: #d97706; min-height: 0; }
    .cv-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    /* 列表行（样本 / 背景）：不换行 —— 两个按钮并排相邻，名称占剩余宽度并省略 */
    .cv-bar--list { flex-wrap: nowrap; }
    .cv-bar--list .tl-label { flex: 0 0 auto; }
    .cv-info { flex: 1 1 auto; min-width: 0; font-size: var(--body-xs-font-size); color: var(--text-tertiary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cv-bar input[type="range"] { width: 120px; }
    .cv-params { order: 1; flex: 0 0 330px; max-width: 360px; display: flex; flex-direction: column; gap: 5px; }
    /* 参数分组头：小标题 + 右延横线 —— 与主窗口设置页 .settings-group 同一视觉（便于快速定位分组） */
    .cv-group { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.4px; color: var(--text-tertiary); white-space: nowrap; }
    .cv-group:first-of-type { margin-top: 2px; }
    .cv-group::after { content: ''; flex: 1; height: 1px; background: var(--border-neutral-l1); }
    .cv-row { display: flex; align-items: center; gap: 8px; }
    .cv-row > .tl-label { flex: 0 0 72px; }
    .cv-row .tl-num { width: 72px; }
    /* 滑杆**固定长度**：各行（含多一个色块的边框行）的滑杆必须等长 ——
       长度不一时，同一位置的可拖行程不同，拖动手感与刻度直觉都会乱。 */
    .cv-row input[type="range"] { flex: 0 0 120px; width: 120px; min-width: 0; }
    /* 数值：**左对齐、紧贴滑杆右端**。
       ⚠ 若用 text-align:right（配合 min-width:36px），数值前的空白会把「0」推到离滑杆
       约 37px 处 —— 数值看起来是个独立浮在行中的东西，与滑杆的从属关系被抹掉。
       左对齐后间距就是行内 8px 的 gap；min-width 仍保留 3 位数宽度，
       使数值位数变化时不致挤压同行的其它元素。 */
    .cv-val { min-width: 26px; text-align: left; font-size: 11px; color: var(--text-secondary); }
    .cv-swatch { width: 28px; height: 22px; padding: 0; border: 1px solid var(--border-neutral-l1);
                 border-radius: 4px; background: none; cursor: pointer; }
    @media (max-width: 940px) {
      .cv-wrap { flex-direction: column; }
      .cv-params { flex: 1 1 auto; max-width: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="win-titlebar" id="winTitlebar">
    <span class="win-titlebar__title">Video Lab - 视频处理</span>
    <div class="win-titlebar__controls">
      <button class="win-titlebar__btn" data-wctl="min" title="最小化">
        <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="win-titlebar__btn" data-wctl="max" title="最大化">
        <svg class="win-titlebar__svg-max" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <svg class="win-titlebar__svg-restore" viewBox="0 0 12 12" style="display:none"><rect x="2.5" y="3.5" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4 3.5V2H9v6H8.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="win-titlebar__btn win-titlebar__btn--close" data-wctl="close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- 两 Tab 共享：目标文件夹与递归 -->
  <div class="tl-input">
    <div class="tl-line">
      <span class="tl-label">素材文件夹</span>
      <input class="tl-text" id="inRoot" placeholder="可直接粘贴/输入文件夹路径，或点右侧按钮选择（留空则不处理）">
      <button class="tl-btn" id="btnPickDir"><i data-icon="folder-open" data-size="14"></i>选择文件夹</button>
      <button class="tl-btn" id="btnPickFiles"><i data-icon="video" data-size="14"></i>选择视频</button>
      <button class="tl-btn" id="btnClearInput" title="清空已选输入"><i data-icon="x" data-size="14"></i>清空</button>
      <label class="opt-check opt-check--sm"><input type="checkbox" id="inRecursive" checked><span class="opt-check__box"></span><span>递归子文件夹</span></label>
    </div>
    <div class="tl-hint" id="inputHint"></div>
  </div>

  <div class="tl-tabs">
    <button class="tl-tab tl-tab--active" data-tab="post"><i data-icon="settings" data-size="14"></i>后处理</button>
    <button class="tl-tab" data-tab="canvas"><i data-icon="layers" data-size="14"></i>画布合成</button>
  </div>

  <div class="tl-scroll">
    <div class="tl-pane" id="panePost">
      <div class="tl-note" id="envWarn" hidden></div>
      <div id="stepGroups"></div>
    </div>
    <div class="tl-pane" id="paneCanvas" hidden>
      <div class="cv-wrap">
        <div class="cv-side">
          <div class="cv-stage">
            <div class="cv-canvas" id="cvCanvas">
              <img class="cv-layer cv-layer--bg" id="cvBg" alt="">
              <img class="cv-layer cv-layer--comp" id="cvComp" alt="">
              <!-- 占位示意层（未开启实时预览时覆盖显示）：真实帧做底 + 内容块虚线随参数即时更新，
                   微调不必每次等一帧渲染；勾选「实时预览」后隐藏本层 -->
              <div class="cv-hold" id="cvHold">
                <div class="cv-hold__box" id="cvHoldBox"></div>
                <div class="cv-hold__tag" id="cvHoldTag">占位示意</div>
              </div>
              <div class="cv-box" id="cvBox">
                <span class="cv-hd" data-hd="tl"></span><span class="cv-hd" data-hd="tr"></span>
                <span class="cv-hd" data-hd="bl"></span><span class="cv-hd" data-hd="br"></span>
              </div>
              <div class="cv-guide cv-guide--v" id="cvGuideV"></div>
              <div class="cv-guide cv-guide--h" id="cvGuideH"></div>
            </div>
            <div class="cv-badge" id="cvBadge">尚未预览</div>
          </div>
          <div class="cv-bars">
            <div class="cv-bar">
              <span class="tl-label">时间点</span>
              <input type="range" id="cvAtRange" min="0" max="1" value="0" step="0.05" title="拖动取帧（松手后渲染）">
              <input class="tl-num" type="number" id="cvAt" min="0" step="0.1" value="0" title="秒">
              <button class="tl-btn" id="cvAtRandom">随机换帧</button>
              <label class="opt-check opt-check--sm" title="勾选 = 每次改动都渲染真实帧（准确，但每次要等一小会儿）；默认为占位示意：即时反馈几何，微调不用等渲染"><input type="checkbox" id="cvLive"><span class="opt-check__box"></span><span>实时预览</span></label>
            </div>
            <!-- 样本 / 背景各一行：两个按钮**并排相邻**，名称紧接在按钮右侧（超长省略，悬浮见全名） -->
            <div class="cv-bar cv-bar--list" id="cvSampleRow" style="display:none">
              <span class="tl-label">样本</span>
              <button class="tl-btn" id="cvSamplePrev">上一个</button>
              <button class="tl-btn" id="cvSampleNext">下一个</button>
              <span class="cv-info" id="cvSampleInfo">—</span>
            </div>
            <div class="cv-bar cv-bar--list">
              <span class="tl-label">背景</span>
              <button class="tl-btn" id="cvBgPrev">上一个</button>
              <button class="tl-btn" id="cvBgNext">下一个</button>
              <span class="cv-info" id="cvBgInfo">—</span>
            </div>
          </div>
          <div class="cv-warn" id="cvWarn"></div>

          <div class="cv-group">水印</div>
          <div class="cv-row">
            <span class="tl-label">水印 PNG</span>
            <input class="tl-path" type="text" id="cvWm" placeholder="可留空（水印图，整幅叠加）" style="flex:1;min-width:0;max-width:340px">
            <button class="tl-btn" id="cvPickWm">选择</button>
          </div>


        </div>

        <div class="cv-params">
          <div class="cv-group">成片画布尺寸（输出分辨率）</div>
          <div class="cv-row">
            <select class="tl-sel" id="cvRatio" style="flex:0 0 84px" title="常用比例：选后改宽/高会按比例联动">
              <option value="9:16">9:16</option>
              <option value="16:9" selected>16:9</option>
              <option value="4:3">4:3</option>
              <option value="3:4">3:4</option>
              <option value="1:1">1:1</option>
              <option value="自定义">自定义</option>
            </select>
            <input class="tl-num" type="number" id="cvTW" min="16" max="7680" step="2" value="1920" title="画布宽（输出分辨率）">
            <button type="button" class="tl-link tl-link--on" id="cvLink" title="比例锁：锁定后改宽/高按比例联动；点击解绑可自由填写"><i data-icon="link" data-size="13"></i></button>
            <input class="tl-num" type="number" id="cvTH" min="16" max="7680" step="2" value="1080" title="画布高（输出分辨率）">
          </div>

          <div class="cv-group">内容（大小 · 位置 · 外观）</div>
          <div class="cv-row">
            <span class="tl-label">等比缩放</span>
            <input type="range" id="cvScale" min="0.05" max="2" step="0.01" value="0.74">
            <input class="tl-num" type="number" id="cvScaleNum" min="0.05" max="3" step="0.01" value="0.74">
          </div>
          <div class="tl-hint">视频在画布中的大小，非输出尺寸；拖角手柄吸满屏 / 一半（Alt 关闭）</div>
          <div class="cv-row">
            <span class="tl-label">基准</span>
            <select class="tl-sel" id="cvPos">
              <option value="center">居中</option>
              <option value="tl">左上</option>
              <option value="tr">右上</option>
              <option value="bl">左下</option>
              <option value="br">右下</option>
              <option value="custom">自定义绝对坐标</option>
            </select>
          </div>
          <div class="cv-row">
            <span class="tl-label">偏移 X / Y</span>
            <input class="tl-num" type="number" id="cvDx" step="1" value="0">
            <input class="tl-num" type="number" id="cvDy" step="1" value="160">
          </div>

          <div class="cv-row">
            <span class="tl-label">圆角</span>
            <input type="range" id="cvRadius" min="0" max="200" step="1" value="0">
            <span class="cv-val" id="cvRadiusVal">0</span>
          </div>
          <div class="cv-row">
            <span class="tl-label">边框</span>
            <input type="range" id="cvBorderW" min="0" max="40" step="1" value="0">
            <span class="cv-val" id="cvBorderWVal">0</span>
            <input class="cv-swatch" type="color" id="cvBorderColor" value="#ffffff" title="边框颜色">
          </div>
          <div class="cv-group">背景</div>
          <div class="cv-row">
            <span class="tl-label">方式</span>
            <select class="tl-sel" id="cvBgMode">
              <option value="dir">目录随机</option>
              <option value="image">图片</option>
              <option value="video">视频</option>
              <option value="color">纯色</option>
            </select>
            <input class="cv-swatch" type="color" id="cvBgColor" value="#000000" title="纯色背景颜色">
          </div>
          <div class="cv-row" id="cvBgDirRow">
            <span class="tl-label">背景目录</span>
            <input class="tl-path" type="text" id="cvBgDir" placeholder="背景图片或视频所在目录" style="flex:1;min-width:0">
            <button class="tl-btn" id="cvPickBgDir">选择</button>
            <button class="tl-btn" id="cvScanBg" title="扫描候选并统计数量">扫描</button>
          </div>
          <div class="cv-row" id="cvEachBgRow">
            <label class="opt-check opt-check--sm" title="勾选后每个背景各出一批（成片数 = 内容数 × 背景数）">
              <input type="checkbox" id="cvEachBg"><span class="opt-check__box"></span><span>每个背景各出一批</span>
            </label>
          </div>
          <div class="cv-row" id="cvBgPathRow" hidden>
            <span class="tl-label">背景文件</span>
            <input class="tl-path" type="text" id="cvBgPath" placeholder="选择背景图片或视频" style="flex:1;min-width:0">
            <button class="tl-btn" id="cvPickBgPath">选择</button>
          </div>
          <div class="cv-row">
            <span class="tl-label">适合方式</span>
            <select class="tl-sel" id="cvBgFit" style="flex:1;min-width:0" title="填充 = 铺满裁掉超出；适应 = 完整显示留黑边；拉伸 = 铺满但可能变形">
              <option value="cover">填充</option>
              <option value="contain">适应</option>
              <option value="stretch">拉伸</option>
            </select>
          </div>
          <div class="cv-row">
            <span class="tl-label">背景模糊</span>
            <input type="range" id="cvBgBlur" min="0" max="60" step="1" value="0">
            <span class="cv-val" id="cvBgBlurVal">0</span>
          </div>

          <div class="cv-group">参数预设</div>
          <div class="cv-row">
            <select class="tl-sel" id="cvPreset" style="flex:1 1 auto;min-width:0;max-width:260px" title="选中即加载"><option value="">（未选择）</option></select>
            <button class="tl-btn" id="cvPresetSave" title="把当前参数存成一个新预设">新建</button>
            <button class="tl-btn" id="cvPresetOverwrite" title="用当前参数覆盖选中的预设">覆盖</button>
            <button class="tl-btn" id="cvPresetDelete">删除</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 输出设置：两 Tab 之外（对所有步骤统一生效） -->
    <!-- 输出设置：**一套 UI、两套数据** —— 后处理与画布合成共用这份控件，切标签页时载入各自那份（互不影响） -->
    <div class="tl-out" id="panelOut">
      <div class="tl-out__head" id="outHead">输出设置</div>
      <div class="tl-out__body">
        <div class="tl-out__row">
          <span class="tl-label">输出方式</span>
          <select class="tl-sel" id="outMode">
            <option value="overwrite">覆盖原视频</option>
            <option value="directory">输出到指定文件夹</option>
          </select>
          <span class="tl-hint" id="outModeHint"></span>
        </div>
        <div class="tl-out__row tl-out__row--hide" id="outDirRow">
          <span class="tl-label">目标文件夹</span>
          <input class="tl-text" id="outDir" placeholder="选择输出文件夹">
          <button class="tl-btn" id="btnPickOutDir"><i data-icon="folder-open" data-size="14"></i>选择</button>
        </div>
        <div class="tl-out__row tl-out__row--hide" id="outNameRow">
          <span class="tl-label">文件名</span>
          <select class="tl-sel" id="outNameMode">
            <option value="keep">原名</option>
            <option value="suffix">原名 + 后缀</option>
          </select>
          <input class="tl-text" id="outSuffix" value="_处理" style="max-width:120px">
          <span class="tl-label">冲突处理</span>
          <select class="tl-sel" id="outConflict">
            <option value="index">追加序号</option>
            <option value="overwrite">覆盖</option>
            <option value="skip">跳过</option>
          </select>
        </div>
        <!-- 输出编码：**只服务画布合成**（存在 cv.params）。后处理有自己的「转码 / 码率」步骤参数，
             因此这一行只在画布标签页出现（切页时由 syncOutputRows 控制显隐）。 -->
        <div class="tl-out__row" id="cvEncRow">
          <span class="tl-label">输出编码</span>
          <select class="tl-sel" id="cvEncCodec" style="max-width:130px" title="H.264 兼容性最好；H.265 体积约小一半；AV1 体积最小但支持面窄">
            <option>H.264</option>
            <option>H.265 / HEVC</option>
            <option>AV1</option>
          </select>
          <span class="tl-label" style="margin-left:10px">CQ</span>
          <input type="range" id="cvEncCq" min="0" max="51" step="1" value="26" style="flex:0 0 110px;width:110px" title="恒定质量：数值越大体积越小、画质越低（0~51）">
          <span class="cv-val" id="cvEncCqVal">26</span>
          <span class="tl-label" style="margin-left:10px">格式</span>
          <select class="tl-sel" id="cvContainer" style="max-width:100px" title="MP4 通用；MOV 便于进剪辑软件">
            <option value="mp4">MP4</option>
            <option value="mov">MOV</option>
          </select>
        </div>
        <div class="tl-sep"></div>
        <div class="tl-out__row">
          <label class="opt-check opt-check--sm"><input type="checkbox" id="outBackup"><span class="opt-check__box"></span><span>处理前备份原文件</span></label>
          <input class="tl-text" id="outBackupDir" placeholder="备份文件夹（留空 = 设置里的默认备份文件夹）" style="max-width:320px">
          <button class="tl-btn" id="btnPickBackupDir"><i data-icon="folder-open" data-size="14"></i>选择备份文件夹</button>
          <button class="tl-btn" id="btnOpenBackupDir" title="打开当前设定的备份文件夹（留空则打开默认备份文件夹）"><i data-icon="folder-open" data-size="14"></i>打开备份文件夹</button>
        </div>
        <div class="tl-hint" id="outHint"></div>
        <div class="tl-sep"></div>
        <!-- 状态 + 开始按钮：收进输出设置框内 —— 单独占一条底部栏只为塞这个按钮，会白费一栏纵向空间 -->
        <div class="tl-out__row tl-out__row--run">
          <span class="tl-status" id="status">正在读取处理能力…</span>
          <button class="tl-run" id="btnRun" disabled><i data-icon="play" data-size="16"></i>开始处理</button>
        </div>
      </div>
    </div>

    <div class="tl-log" id="logBox" hidden>
      <div class="tl-log__head" id="logHead">
        <span class="tl-group__arrow"><i data-icon="chevron-right" data-size="14"></i></span>
        <span id="logTitle">运行日志</span>
        <span class="tl-group__count" id="logCount"></span>
      </div>
      <div class="tl-log__body" id="logBody"></div>
      <div class="tl-prog"><div class="tl-prog__bar" id="progBar"></div></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="txapi.js"></script>
<script src="common.js"></script>
  <script src="logbootstrap.js"></script>
  <script src="titlebar.js"></script>
  <script src="tool.js"></script>
</body>
</html>
