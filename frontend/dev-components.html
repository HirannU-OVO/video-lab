<!DOCTYPE html>
<html lang="zh-CN" data-skin="white_blue">
<head>
<meta charset="utf-8">
<title>基础组件 · 组件展示</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles/pages/dev-components.css">
<link rel="stylesheet" href="skins/_all.css">
</head>
<body class="vl-dc">
  <!-- 组件展示页：C-04 组件工厂的活样板 + C-07 组件级视觉快照的载体。
       只用基础组件类与语义令牌：无硬编码色、无内联样式、引用公共层 → 自动被皮肤覆盖。 -->
  <header class="vl-dc__head">
    <h1 class="vl-dc__title">基础组件</h1>
    <p class="vl-hint">由 <code>VL.ui</code> 工厂渲染（.vl-btn / .vl-input / .vl-check / .vl-tag）。切换皮肤时整页跟随。</p>
  </header>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">按钮 · variant</h2>
    <div class="vl-row" id="rowsVariant"></div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">按钮 · size</h2>
    <div class="vl-row" id="rowsSize"></div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">按钮 · state</h2>
    <div class="vl-row" id="rowsState"></div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">输入框</h2>
    <div class="vl-row" id="rowsInput"></div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">复选框</h2>
    <div class="vl-col" id="rowsCheck"></div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">标签</h2>
    <div class="vl-row" id="rowsTag"></div>
  </section>

  <!-- 状态样例：组件层用到的每个状态在这里各出现一次。
       守门 verify-state-showcase.js 保证「组件层用到的状态 ⊆ 本页枚举」，新增状态必须补样例。 -->
  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">状态 · 按钮</h2>
    <div class="vl-row">
      <button class="vl-btn" aria-pressed="true">按下（aria-pressed）</button>
      <button class="vl-btn" aria-disabled="true">不可用（aria-disabled）</button>
      <button class="vl-btn" data-loading="1">提交中（data-loading）</button>
      <button class="vl-btn" disabled>禁用（disabled）</button>
    </div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">状态 · 输入</h2>
    <div class="vl-row">
      <input class="vl-input" value="错误态" aria-invalid="true">
      <input class="vl-input" value="只读" readonly>
      <input class="vl-input" value="禁用" disabled>
      <textarea class="vl-textarea" data-state="error" rows="2">多行错误态（data-state="error"）</textarea>
    </div>
    <div class="vl-row">
      <button class="vl-btn" data-state="pressed">按下态（data-state="pressed"）</button>
    </div>

    <!-- 分页：当前页用 aria-current="page"，禁用页用 disabled -->
    <h2 class="vl-dc__h2">分页</h2>
    <div class="vl-row">
      <div class="vl-pagination">
        <button class="vl-pagination__item" disabled>‹</button>
        <button class="vl-pagination__item" aria-current="page">1</button>
        <button class="vl-pagination__item">2</button>
        <button class="vl-pagination__item">3</button>
        <button class="vl-pagination__item">›</button>
        <span class="vl-pagination__range">第 1–15 条</span>
      </div>
    </div>
  </section>

  <section class="vl-dc__sec">
    <h2 class="vl-dc__h2">状态 · 选择</h2>
    <div class="vl-row">
      <label class="vl-check"><input type="checkbox" checked><span class="vl-check__box"></span>已选中（:checked）</label>
      <label class="vl-check"><input type="checkbox" disabled><span class="vl-check__box"></span>禁用（:disabled）</label>
      <label class="vl-check" data-disabled="1"><input type="checkbox"><span class="vl-check__box"></span>只读（data-disabled）</label>
    </div>
    <div class="vl-row">
      <button class="vl-tab" role="tab" aria-selected="true">选中 tab</button>
      <button class="vl-tab" role="tab" aria-selected="false">未选中 tab</button>
      <button class="vl-btn vl-btn--ghost" aria-checked="true">切换项（aria-checked）</button>
    </div>
  </section>

  <script src="common.js"></script>
  <script src="dev-components.js"></script>
</body>
</html>
