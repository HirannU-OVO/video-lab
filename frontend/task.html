<!DOCTYPE html>
<html lang="zh-CN" data-skin="white_blue"><head>
  <meta charset="UTF-8">
  <title>Video Lab - 任务</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/pages/task.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="skins/white_blue.css">
  <link rel="stylesheet" href="skins/Black_Orange.css">
  <link rel="stylesheet" href="skins/Maid_Atelier.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="../icon/preview/app-icon.png">
  <script>
    if (location.protocol.startsWith('http')) {
var m = new URL(location.href).searchParams.get('token');
      if (m) localStorage.setItem('tx_token', m);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
      // 内嵌模态带 skin 参数：iframe 渲染前同步应用当前皮肤，避免先白后换的闪烁
      var sk = new URL(location.href).searchParams.get('skin');
      if (sk) document.documentElement.setAttribute('data-skin', sk); else { try { var _sk0 = localStorage.getItem('vl_skin'); if (_sk0) document.documentElement.setAttribute('data-skin', _sk0); } catch (e) {} }
    }
  </script>
  
</head>
<body>
  <div class="win-titlebar" id="winTitlebar">
    <span class="win-titlebar__title">Video Lab - 任务</span>
    <div class="win-titlebar__controls">
      <button class="win-titlebar__btn win-titlebar__btn--close" data-wctl="close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>
      </button>
    </div>
  </div>
  <div class="task-tabs" id="taskTabs">
    <button class="task-tab task-tab--active" data-tab="running" id="tabRunning">
      <i data-icon="play" data-size="16"></i><span style="font-size: 15px">正在运行</span><span class="task-tab__count" id="cntRunning">0</span>
    </button>
    <button class="task-tab" data-tab="done" id="tabDone">
      <i data-icon="check" data-size="16"></i><span style="font-size: 15px">已完成</span><span class="task-tab__count" id="cntDone">0</span>
    </button>
    <button class="task-tab" data-tab="stopped" id="tabStopped" style="font-size: 16px;">
      <i data-icon="stop" data-size="16"></i><span style="font-size: 15px;">已停止</span><span class="task-tab__count" id="cntStopped">0</span>
    </button>
  </div>
  <div class="task-main">
    <div class="task-list" id="taskList"></div>
    <div class="task-fab-actions" id="taskFabActions">
      <button class="task-fab" id="fabResumeAll" title="全部继续（恢复所有暂停任务）"><i data-icon="play" data-size="18"></i></button>
      <button class="task-fab" id="fabPauseAll" title="全部暂停（暂停所有排队任务）"><i data-icon="pause" data-size="18"></i></button>
    </div>
    <button class="task-fab" id="taskFab" title="清除列表" style="display:none"><i data-icon="trash-2" data-size="20"></i></button>
  </div>
  <script src="icons.js"></script>
  <script src="txapi.js"></script>
<script src="common.js"></script>
  <script src="logbootstrap.js"></script>
  <script src="titlebar.js"></script>
  <script src="task.js"></script>


</body></html>
